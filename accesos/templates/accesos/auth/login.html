{% extends 'accesos/base.html' %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
    <h2>Iniciar sesión</h2>

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        {{ form.as_p }}
        <button type="submit">Entrar</button>
    </form>

    <p>¿No tiene cuenta? <a href="{% url 'registrarse' %}">Regístrese aquí</a></p>
{% endblock %}
